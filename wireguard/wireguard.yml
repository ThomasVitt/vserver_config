---
- name: WireGuard-Server auf Ubuntu 24.04 einrichten
  hosts: wireguard
  connection: local
  become: true

  vars:
    wg_interface: wg0
    wg_port: 51820
    wg_address: 10.8.0.1/24
    wg_subnet: 10.8.0.0/24
    # Netzwerkinterface mit Internetzugang (leer = automatisch ermitteln)
    wg_external_interface: ""
    # Peers: public_key per `wg genkey | tee priv | wg pubkey` auf dem Client erzeugen
    # TCP-Ports, die in iptables erlaubt werden (SSH, HTTP, HTTPS)
    wg_allowed_tcp_ports: [22, 80, 443]
    # wireguard-go Logging (nur im Userspace-Modus): verbose zeigt Handshakes aller Peers
    wg_go_log_level: verbose   # verbose | error | silent
    wg_go_log_file: /var/log/wireguard-go.log
    wg_peers:
      - name: macbook
        public_key: "L0DOJWsfHs/snFXXgb6X9w9TkzTi3fIA2uLXVUEizjo="
        allowed_ips: 10.8.0.2/32
      - name: thomas-iphone
        public_key: "UZUVIQ37vuri1kPzv07IJOQonV8pSlRSJZT3ZLZvUQE="
        allowed_ips: 10.8.0.3/32
      - name: fritzbox5g
        public_key: "JupUhk2lg9PzwuMAVBRZdvDI4hIQHSpqVqDk71riI1s="
        allowed_ips: 10.8.0.4/32, 192.168.170.0/24
      - name: rasp-pi-4
        public_key: "X+51/P//phhwE9OqEwbZWAAi/C+ag98KBeRNrTOw5WU="
        allowed_ips: 10.8.0.5/32

  tasks:
    - name: WireGuard installieren
      ansible.builtin.apt:
        name:
          - wireguard
          - wireguard-tools
          - iptables
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Erst alle ACCEPT-Regeln anlegen, die Default-Policy DROP folgt ganz am Ende
    - name: Loopback-Verkehr erlauben
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT
        action: insert
        rule_num: "1"
        comment: "Allow loopback"

    - name: Bestehende Verbindungen erlauben (hält laufende SSH-Session offen)
      ansible.builtin.iptables:
        chain: INPUT
        ctstate: [ESTABLISHED, RELATED]
        jump: ACCEPT
        action: insert
        rule_num: "1"
        comment: "Allow established"

    - name: ICMP (Ping) erlauben
      ansible.builtin.iptables:
        chain: INPUT
        protocol: icmp
        jump: ACCEPT
        action: insert
        rule_num: "1"
        comment: "Allow icmp"

    # Auf OpenVZ/LXC fehlt das Kernel-Modul: dann Userspace-Implementierung wireguard-go
    - name: Prüfen, ob der Kernel WireGuard unterstützt
      ansible.builtin.shell: |
        ip link add wgprobe0 type wireguard && ip link delete wgprobe0
      register: wg_kernel_probe
      changed_when: false
      failed_when: false

    - name: Userspace-Modus festlegen
      ansible.builtin.set_fact:
        wg_userspace: "{{ wg_kernel_probe.rc != 0 }}"

    - name: wireguard-go installieren (Userspace-Fallback)
      ansible.builtin.apt:
        name: wireguard-go
        state: present
      when: wg_userspace

    - name: /dev/net/tun prüfen (für wireguard-go zwingend)
      ansible.builtin.stat:
        path: /dev/net/tun
      register: wg_tun
      when: wg_userspace

    - name: Abbrechen, wenn TUN fehlt
      ansible.builtin.fail:
        msg: >-
          Kein Kernel-WireGuard und kein /dev/net/tun. Beim Anbieter (OpenVZ)
          TUN/TAP aktivieren lassen, danach das Playbook erneut ausführen.
      when: wg_userspace and not wg_tun.stat.exists

    - name: systemd-Drop-in-Verzeichnis für wg-quick anlegen
      ansible.builtin.file:
        path: "/etc/systemd/system/wg-quick@{{ wg_interface }}.service.d"
        state: directory
        mode: "0755"
      when: wg_userspace

    - name: Wrapper für wireguard-go mit Logging installieren
      ansible.builtin.copy:
        dest: /usr/local/bin/wireguard-go-logged
        mode: "0755"
        content: |
          #!/bin/bash
          # Startet wireguard-go im Vordergrund (-f), aber im Hintergrund der Shell,
          # und schreibt alle Meldungen in {{ wg_go_log_file }} und ins Journal (Tag wireguard-go).
          iface="$1"
          export LOG_LEVEL="{{ wg_go_log_level }}"
          setsid bash -c '/usr/bin/wireguard-go -f "$0" 2>&1 | tee -a "{{ wg_go_log_file }}" | logger -t wireguard-go' "$iface" </dev/null >/dev/null 2>&1 &
          # warten, bis Interface und Control-Socket da sind, damit wg-quick weitermachen kann
          for _ in $(seq 1 100); do
            if ip link show "$iface" >/dev/null 2>&1 && [ -S "/var/run/wireguard/$iface.sock" ]; then
              exit 0
            fi
            sleep 0.1
          done
          echo "wireguard-go: Interface $iface nicht bereit, siehe {{ wg_go_log_file }}" >&2
          exit 1
      when: wg_userspace
      notify: Restart WireGuard

    - name: wg-quick auf den Wrapper umstellen
      ansible.builtin.copy:
        dest: "/etc/systemd/system/wg-quick@{{ wg_interface }}.service.d/userspace.conf"
        content: |
          [Service]
          Environment=WG_QUICK_USERSPACE_IMPLEMENTATION=/usr/local/bin/wireguard-go-logged
          Environment=WG_SUDO=1
        mode: "0644"
      when: wg_userspace
      notify: Restart WireGuard

    - name: Logrotate für wireguard-go
      ansible.builtin.copy:
        dest: /etc/logrotate.d/wireguard-go
        mode: "0644"
        content: |
          {{ wg_go_log_file }} {
              weekly
              rotate 8
              compress
              missingok
              notifempty
              copytruncate
          }
      when: wg_userspace

    - name: Eingehende TCP-Ports 22, 80 und 443 in iptables erlauben
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "{{ item }}"
        ctstate: NEW
        jump: ACCEPT
        action: insert
        rule_num: "1"
        comment: "Allow tcp/{{ item }}"
      loop: "{{ wg_allowed_tcp_ports }}"

    - name: WireGuard-UDP-Port erlauben
      ansible.builtin.iptables:
        chain: INPUT
        protocol: udp
        destination_port: "{{ wg_port | string }}"
        jump: ACCEPT
        action: insert
        rule_num: "1"
        comment: "Allow WireGuard"

    - name: Externes Interface ermitteln
      ansible.builtin.set_fact:
        wg_ext_if: "{{ wg_external_interface | default('', true) or ansible_facts['default_ipv4']['interface'] }}"

    - name: IPv4-Forwarding aktivieren
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/99-wireguard.conf
        sysctl_set: true
        state: present
        reload: true

    - name: Server-Privatschlüssel erzeugen (nur falls nicht vorhanden)
      ansible.builtin.shell: |
        umask 077
        wg genkey > /etc/wireguard/server_private.key
      args:
        creates: /etc/wireguard/server_private.key

    - name: Privatschlüssel einlesen
      ansible.builtin.slurp:
        src: /etc/wireguard/server_private.key
      register: wg_private_key
      no_log: true

    - name: Public Key des Servers berechnen
      ansible.builtin.command: wg pubkey
      args:
        stdin: "{{ wg_private_key.content | b64decode | trim }}"
      register: wg_public_key
      changed_when: false
      no_log: true

    - name: WireGuard-Konfiguration schreiben
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: "/etc/wireguard/{{ wg_interface }}.conf"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart WireGuard

    - name: UFW-Status prüfen
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: UDP-Port in UFW freigeben (falls UFW aktiv)
      community.general.ufw:
        rule: allow
        port: "{{ wg_port | string }}"
        proto: udp
      when: "'Status: active' in ufw_status.stdout"

    - name: WireGuard-Dienst aktivieren und starten
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        enabled: true
        state: started
        daemon_reload: true

    # Policy erst nach allen Accept-Regeln und nach dem Start von WireGuard
    # (dessen PostUp legt die FORWARD-Regeln an). Nicht persistent: nach Reboot Default ACCEPT.
    - name: Default-Policy INPUT auf DROP setzen
      ansible.builtin.iptables:
        chain: INPUT
        policy: DROP

    - name: Default-Policy FORWARD auf DROP setzen
      ansible.builtin.iptables:
        chain: FORWARD
        policy: DROP

    - name: Public Key des Servers anzeigen
      ansible.builtin.debug:
        msg: "Server Public Key: {{ wg_public_key.stdout }}  |  Endpoint: {{ ansible_host | default(inventory_hostname) }}:{{ wg_port }}"

  handlers:
    - name: Restart WireGuard
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        state: restarted
