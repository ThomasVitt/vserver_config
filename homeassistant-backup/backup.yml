---
# Samba-Freigabe auf dem vServer als Backup-Ziel ("Netzwerkspeicher") fuer Home Assistant OS.
# Nur ueber das WireGuard-VPN erreichbar: Samba bindet nur an wg0, iptables erlaubt 445 nur auf wg0.
#
# Ausfuehren (auf dem vServer):
#   ansible-playbook -i ../wireguard/inventory.ini backup.yml
# Das Samba-Passwort wird abgefragt (oder: -e backup_password=...).
- name: Backup-Ziel (Samba) fuer Home Assistant einrichten
  hosts: wireguard
  connection: local
  become: true

  vars_prompt:
    - name: backup_password
      prompt: "Samba-Passwort fuer den Backup-Benutzer"
      private: true
      confirm: true

  vars:
    wg_interface: wg0
    backup_user: habackup
    backup_share: habackup
    backup_path: /srv/backup/homeassistant
    # Netze, die zugreifen duerfen: VPN + Stall-Netz (je nachdem, ob der Pi NAT macht,
    # kommt Home Assistant mit 10.8.0.x oder mit seiner 192.168.170.x-Adresse an)
    backup_allowed_networks:
      - 10.8.0.0/24
      - 192.168.170.0/24
    # true = Passwort eines bestehenden Samba-Benutzers neu setzen
    backup_reset_password: false

  tasks:
    - name: Samba installieren
      ansible.builtin.apt:
        name: samba
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Systembenutzer fuer Backups anlegen (kein Login)
      ansible.builtin.user:
        name: "{{ backup_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Backup-Verzeichnis anlegen
      ansible.builtin.file:
        path: "{{ backup_path }}"
        state: directory
        owner: "{{ backup_user }}"
        group: "{{ backup_user }}"
        mode: "0700"

    - name: Samba konfigurieren
      ansible.builtin.template:
        src: smb.conf.j2
        dest: /etc/samba/smb.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: testparm -s %s
      notify: Restart smbd

    - name: Pruefen, ob der Samba-Benutzer existiert
      ansible.builtin.command: pdbedit -L -u {{ backup_user }}
      register: backup_pdbedit
      changed_when: false
      failed_when: false

    - name: Samba-Passwort setzen
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s\n%s\n' "$PW" "$PW" | smbpasswd -s -a {{ backup_user }}
      args:
        executable: /bin/bash
      environment:
        PW: "{{ backup_password }}"
      no_log: true
      when: backup_pdbedit.rc != 0 or backup_reset_password | bool

    # smbd soll erst nach wg0 starten und bei einem Neustart von WireGuard mit neu starten
    - name: systemd-Drop-in-Verzeichnis fuer smbd anlegen
      ansible.builtin.file:
        path: /etc/systemd/system/smbd.service.d
        state: directory
        mode: "0755"

    - name: smbd an WireGuard koppeln
      ansible.builtin.copy:
        dest: /etc/systemd/system/smbd.service.d/wireguard.conf
        mode: "0644"
        content: |
          [Unit]
          After=wg-quick@{{ wg_interface }}.service
          Wants=wg-quick@{{ wg_interface }}.service
          PartOf=wg-quick@{{ wg_interface }}.service
      notify: Restart smbd

    - name: nmbd (NetBIOS) abschalten, wird nicht gebraucht
      ansible.builtin.systemd:
        name: nmbd
        enabled: false
        state: stopped
      failed_when: false

    - name: SMB (tcp/445) nur aus dem VPN erlauben
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: "{{ wg_interface }}"
        protocol: tcp
        destination_port: "445"
        ctstate: NEW
        jump: ACCEPT
        action: insert
        rule_num: "1"
        comment: "Allow SMB from VPN"

    - name: smbd aktivieren und starten
      ansible.builtin.systemd:
        name: smbd
        enabled: true
        state: started
        daemon_reload: true

    - name: Freien Speicherplatz anzeigen
      ansible.builtin.command: df -h {{ backup_path }}
      register: backup_df
      changed_when: false

    - name: Hinweis fuer Home Assistant
      ansible.builtin.debug:
        msg:
          - "Server: {{ wg_address | default('10.8.0.1') | regex_replace('/.*$', '') }}  Freigabe: {{ backup_share }}  Benutzer: {{ backup_user }}"
          - "{{ backup_df.stdout_lines }}"

  handlers:
    - name: Restart smbd
      ansible.builtin.systemd:
        name: smbd
        state: restarted
        daemon_reload: true
